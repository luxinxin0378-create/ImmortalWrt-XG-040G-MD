name: XG-040G-MD

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: "源码分支（插件组合按 OpenWrt 25.12 验证）"
        required: true
        default: "openwrt-25.12-XG-040G-MD"
        type: choice
        options:
          - openwrt-25.12-XG-040G-MD

permissions:
  contents: read

env:
  REPO_URL: https://github.com/fzs209/immortalwrt.git
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  CONFIG_FILE: config/xg-040g-md.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo apt-get update
          sudo apt-get install -y dos2unix libfuse-dev git rsync
          sudo timedatectl set-timezone "$TZ"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 2048
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: Clone target source
        env:
          REPO_BRANCH: ${{ inputs.repo_branch }}
        run: |
          set -eux
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"
          echo "REPO_BRANCH=$REPO_BRANCH" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"
          df -hT

      - name: Add compatible package sources
        run: |
          set -eux
          cd "$OPENWRT_PATH"
          # Keep QModem; add PassWall and its matching core-package feed.
          grep -q '^src-git qmodem ' feeds.conf.default || echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default
          grep -q '^src-git passwall_packages ' feeds.conf.default || echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          grep -q '^src-git passwall ' feeds.conf.default || echo 'src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> feeds.conf.default

          mkdir -p package/custom
          git clone --depth 1 -b openwrt-25.12 https://github.com/sbwml/luci-theme-argon.git /tmp/luci-theme-argon
          test -f /tmp/luci-theme-argon/luci-theme-argon/Makefile
          cp -a /tmp/luci-theme-argon/luci-theme-argon package/custom/

          git clone --depth 1 https://github.com/sirpdboy/luci-app-adguardhome.git /tmp/luci-app-adguardhome
          test -f /tmp/luci-app-adguardhome/luci-app-adguardhome/Makefile
          cp -a /tmp/luci-app-adguardhome/luci-app-adguardhome package/custom/

          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          test -f /tmp/OpenClash/luci-app-openclash/Makefile
          cp -a /tmp/OpenClash/luci-app-openclash package/custom/

          # Turbo ACC UI only: do not enable Shortcut-FE/SFE kernel modules on this target.
          git clone --depth 1 -b luci https://github.com/chenmozhijin/turboacc.git /tmp/turboacc
          test -f /tmp/turboacc/luci-app-turboacc/Makefile
          cp -a /tmp/turboacc/luci-app-turboacc package/custom/

      - name: Update and install feeds
        run: |
          set -eux
          cd "$OPENWRT_PATH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p qmodem
          ./scripts/feeds install -a -p passwall_packages
          ./scripts/feeds install -a -p passwall

      - name: Load device configuration and validate package symbols
        run: |
          set -eux
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          make defconfig
          grep -q '^CONFIG_TARGET_airoha=y' .config
          grep -q '^CONFIG_TARGET_airoha_an7581=y' .config
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-040g-md=y' .config
          for pkg in qmodem luci-app-qmodem-next luci-app-adguardhome adguardhome luci-theme-argon luci-app-nlbwmon luci-app-statistics luci-app-ttyd luci-app-sqm luci-app-homeproxy luci-app-passwall luci-app-openclash luci-app-turboacc; do
            if grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "Selected: ${pkg}"
            else
              echo "ERROR: required first-pass package ${pkg} is missing or was dropped by make defconfig"
              exit 1
            fi
          done
          echo "Kernel/container feature indicators (informational only):"
          grep -E '^CONFIG_KERNEL_(CGROUPS|NAMESPACES|OVERLAY_FS|VETH|SECCOMP|CGROUP_BPF)' .config || true
          cp .config "$GITHUB_WORKSPACE/build.config"
          echo "Selected package count: $(grep -c '^CONFIG_PACKAGE_.*=y' .config || true)"

      - name: Download sources
        run: |
          set -eux
          cd "$OPENWRT_PATH"
          make download -j8
          find dl -size -1024c -print -delete || true

      - name: Compile firmware
        run: |
          set -eux
          cd "$OPENWRT_PATH"
          make -j"$(nproc)" || make -j1 V=s

      - name: Inspect firmware outputs
        if: success()
        run: |
          set -eux
          cd "$OPENWRT_PATH"
          df -hT
          find bin/targets/airoha/an7581 -maxdepth 2 -type f -printf '%s %p\n' | sort -n
          test -f bin/targets/airoha/an7581/sha256sums
          cp .config bin/targets/airoha/an7581/build.config
          cp "$GITHUB_WORKSPACE/PLUGIN-INTEGRATION.md" bin/targets/airoha/an7581/PLUGIN-INTEGRATION.md
          (cd bin/targets/airoha/an7581 && sha256sum *.bin *.tar 2>/dev/null || true) > bin/targets/airoha/an7581/custom-sha256sums.txt

      - name: Upload test artifacts (no Release publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-test-${{ github.run_number }}
          path: |
            openwrt/bin/targets/airoha/an7581/
            build.config
          if-no-files-found: warn
          retention-days: 14
